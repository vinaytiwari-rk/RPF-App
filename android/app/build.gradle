plugins { id 'com.android.application' }

android {
    namespace 'com.rpfoundation.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.rpfoundation.app'
        minSdk 24
        targetSdk 36
        versionCode ((System.getenv('RPF_VERSION_CODE') ?: '1') as Integer)
        versionName (System.getenv('RPF_VERSION_NAME') ?: '1.0.0')
    }
}

dependencies {
    // Capacitor is supplied by the project generated by `npx cap sync android`.
    // Missing native dependencies must fail explicitly rather than resolving a
    // dynamic or CI-injected version.
    if (findProject(':capacitor-android') == null) {
        throw new GradleException('capacitor-android project is missing. Run `npx cap sync android` before building.')
    }
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}

// Regenerated by `npx cap sync android` and used to copy the current web build into the APK.
apply from: 'capacitor.build.gradle'
