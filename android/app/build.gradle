plugins { id 'com.android.application' }

android {
    namespace 'com.rpfoundation.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.rpfoundation.app'
        minSdk 24
        targetSdk 36
        versionCode (System.getenv("RPF_VERSION_CODE") ? Integer.parseInt(System.getenv("RPF_VERSION_CODE")) : 21565)
        versionName '2.5.5'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("RPF_RELEASE_STORE_FILE")
            if (storeFilePath && file(storeFilePath).exists()) {
                storeFile file(storeFilePath)
                storePassword System.getenv("RPF_RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RPF_RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RPF_RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def storeFilePath = System.getenv("RPF_RELEASE_STORE_FILE")
            if (storeFilePath && file(storeFilePath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    // Prefer the local Capacitor Android project when available (from node_modules).
    // If not present in the CI runner, fall back to a pinned published version provided
    // via the CAPACITOR_ANDROID_VERSION gradle property (written by the workflow).
    if (findProject(':capacitor-android') != null) {
        implementation project(':capacitor-android')
    } else if (project.hasProperty('CAPACITOR_ANDROID_VERSION')) {
        implementation "com.getcapacitor:capacitor-android:${CAPACITOR_ANDROID_VERSION}"
    } else {
        // Last resort: attempt a dynamic resolution (not recommended but kept as fallback)
        implementation 'com.getcapacitor:capacitor-android:+'
    }

    implementation project(':capacitor-cordova-android-plugins')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}

// Single authoritative launcher-icon source: public/assets/logo.png.
// Copy it into the Android resource tree before every Android build.
tasks.register('prepareRpfLauncherIcon', Copy) {
    from(file("${rootProject.projectDir}/../public/assets/logo.png"))
    into(file("${projectDir}/src/main/res/drawable"))
    rename { 'rpf_logo.png' }
}

preBuild.dependsOn(tasks.named('prepareRpfLauncherIcon'))

// Regenerated by `npx cap sync android` and used to copy the current web build into the APK.
apply from: 'capacitor.build.gradle'
