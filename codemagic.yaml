workflows:
  rpf-android-apk:
    name: Build RPF Android APK
    max_build_duration: 60

    environment:
      node: 22
      java: 21

    scripts:
      - name: Install dependencies
        script: |
          npm install --no-audit --no-fund

      - name: Verify Capacitor Android
        script: |
          test -f node_modules/@capacitor/android/package.json
          node -p "require('./node_modules/@capacitor/android/package.json').version"

      - name: Build web application
        script: |
          npx vite build

      - name: Sync Capacitor Android
        script: |
          npx cap sync android

      - name: Install Gradle 8.11.1
        script: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          export PATH="$PWD/gradle-8.11.1/bin:$PATH"
          gradle --version

      - name: Build Debug APK
        script: |
          export PATH="$CM_BUILD_DIR/gradle-8.11.1/bin:$PATH"
          cd android
          gradle :app:assembleDebug --no-daemon --stacktrace

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
