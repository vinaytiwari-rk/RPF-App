name: Phase 3 Verification

on:
  push:
    branches:
      - phase-3-premium-frontend
      - phase-3-complete
  pull_request:
    branches:
      - main
      - phase-3-premium-frontend
      - phase-3-complete

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build
