name: Phase 5 Production Verification

on:
  push:
    branches:
      - phase-5-production-completion
  pull_request:
    branches:
      - main
      - phase-5-production-completion

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Validate migration files are PostgreSQL SQL
        shell: bash
        run: |
          set -euo pipefail
          for file in migrations/*.sql; do
            test -s "$file"
            case "$file" in
              *20260814_01_phase5_core_data_contract.sql) grep -q "BEGIN;" "$file"; grep -q "COMMIT;" "$file" ;;
            esac
          done
          echo "Migration files passed static validation."
