name: Phase 2 Verification

on:
  push:
    branches:
      - phase-2-production-hardening
  pull_request:
    branches:
      - main
      - phase-2-production-hardening

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build
