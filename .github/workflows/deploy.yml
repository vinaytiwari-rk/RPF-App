name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Verify generated assets
        run: node -e "const fs=require('fs'),p=require('path');const h=fs.readFileSync('dist/index.html','utf8');const refs=[...h.matchAll(/(?:src|href)=\\\"([^\\\"]+\\.(?:js|css))\\\"/g)].map(m=>m[1].replace(/^\\//,''));if(!refs.length)throw new Error('No JS/CSS assets');for(const r of refs){if(!fs.existsSync(p.join('dist',r)))throw new Error('Missing '+r)}console.log('Assets verified',refs.length)"
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-dist
          path: dist
          if-no-files-found: error

  deploy-cpanel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: deployment-dist
          path: dist
      - name: Deploy
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SECURE: ${{ secrets.FTP_SECURE }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: node deploy.cjs
      - name: Production liveness
        run: node -e "require('https').get('https://appapi.therpfoundation.org/api/liveness',r=>{console.log('HTTP',r.statusCode);process.exit(r.statusCode===200?0:1)}).on('error',e=>{console.error(e.message);process.exit(1)})"
