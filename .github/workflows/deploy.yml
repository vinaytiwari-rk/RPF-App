name: Deploy Application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Browser Policy Regression Check
        run: npm run browser:check
      - name: Browser Critical Link Smoke Check
        run: npm run browser:smoke
      - name: Type Check & Lint
        run: npm run lint
      - name: Build Application
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-dist
          path: dist
          if-no-files-found: error

  android-runtime-build:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Sync Android Runtime
        run: npm run android:sync
      - name: Build Android Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: samahit-views-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  deploy-cpanel:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Deployment Dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-dist
          path: dist
      - name: Diagnose FTP endpoint
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          PORT="${FTP_PORT:-21}"
          echo "Testing TCP connectivity to configured FTP endpoint on port ${PORT}"
          timeout 15 bash -c "</dev/tcp/$FTP_HOST/$PORT" && echo "TCP endpoint reachable" || echo "TCP endpoint unavailable from this GitHub runner"
      - name: Delete maps-master from cPanel
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SECURE: ${{ secrets.FTP_SECURE || 'true' }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: node delete_cpanel_maps.cjs
      - name: Deploy to cPanel
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SECURE: ${{ secrets.FTP_SECURE || 'true' }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: node deploy.cjs
