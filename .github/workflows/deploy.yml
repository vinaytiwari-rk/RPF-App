name: Deploy Application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm install --no-audit --no-fund
      - name: Browser Policy Regression Check
        run: npm run browser:check
      - name: Browser Critical Link Smoke Check
        run: npm run browser:smoke
      - name: Type Check & Lint
        run: npm run lint
      - name: Build Application
        run: npm run build
      - name: Delete maps-master from cPanel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SECURE: ${{ secrets.FTP_SECURE || 'true' }}
        run: node delete_cpanel_maps.cjs
      - name: Deploy to cPanel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SECURE: ${{ secrets.FTP_SECURE || 'true' }}
        run: node deploy.cjs
      - name: Deploy Live Update to Capgo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -z "$CAPGO_TOKEN" ]; then
            echo "WARNING: CAPGO_TOKEN is not set. Skipping Capgo deploy."
          else
            npx @capgo/cli@latest bundle upload com.rpfoundation.app --channel production --path ./dist --auto-bump patch
          fi
