name: SAMAHIT Question Bank Verification
on:
  push:
    branches:
      - feat/samahit-hybrid-bank-foundation-2026-10-14
  pull_request:
    branches:
      - main
    paths:
      - "data/question-bank/**"
      - "scripts/validateQuestionBankPacks.mjs"
      - "scripts/buildQuestionBankManifest.mjs"
      - "scripts/testQuestionBankPacks.mjs"
      - "scripts/testSamahitTestEngine.ts"
      - "src/lib/hybridQuestionBank.ts"
      - "src/utils/samahitTestEngine.ts"
      - "src/pages/OnlineTestCenterPage.tsx"
      - "package.json"
      - ".github/workflows/question-bank-verify.yml"
permissions:
  contents: read
jobs:
  verify-question-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate pack schema, sources and duplicates
        run: npm run quiz:bank:validate
      - name: Test pack answer keys
        run: npm run quiz:bank:test
      - name: Test all six presets and answer shuffling
        run: npm run quiz:bank:engine-test
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
