name: SAMAHIT Question Bank Verification

on:
  push:
    branches:
      - feat/samahit-50k-hybrid-question-bank
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: samahit-question-bank-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-question-bank:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate question packs
        run: npm run quiz:bank:validate
      - name: TypeScript type check
        run: npm run lint
      - name: Production build
        run: npm run build
