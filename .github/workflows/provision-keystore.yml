name: Provision Permanent Android Keystore

on:
  workflow_dispatch:

jobs:
  provision-keystore:
    name: Provision Permanent Release Keystore
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install libsodium
        run: npm install --no-save libsodium-wrappers

      - name: Generate and Provision Permanent Release Keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Generate random strong 32-character passwords
          STORE_PASS=$(node -e "console.log(require('crypto').randomBytes(24).toString('base64'))")
          KEY_PASS="$STORE_PASS"
          KEY_ALIAS="rpf-permanent-release-key"

          echo "Generating 2048-bit RSA permanent release keystore..."
          keytool -genkeypair -v \
            -keystore rpf-permanent-release.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=RP Foundation, OU=SAMAHIT Engineering, O=RP Foundation, L=Prayagraj, ST=Uttar Pradesh, C=IN"

          echo "Extracting SHA-256 certificate fingerprint..."
          keytool -list -v -keystore rpf-permanent-release.jks -alias "$KEY_ALIAS" -storepass "$STORE_PASS" | grep "SHA256:"

          export KEYSTORE_B64
          export STORE_PASS
          export KEY_PASS
          export KEY_ALIAS

          echo "Uploading encrypted secrets to GitHub Actions..."
          node -e '
            const https = require("https");
            const sodium = require("libsodium-wrappers");
            const token = process.env.GH_TOKEN;

            async function run() {
              await sodium.ready;
              const pk = await new Promise((resolve, reject) => {
                https.get({
                  hostname: "api.github.com",
                  path: "/repos/vinaytiwari-rk/RPF-App/actions/secrets/public-key",
                  headers: { "User-Agent": "NodeJS", "Authorization": "Bearer " + token }
                }, (res) => {
                  let d = "";
                  res.on("data", c => d += c);
                  res.on("end", () => resolve(JSON.parse(d)));
                }).on("error", reject);
              });

              if (!pk || !pk.key) {
                throw new Error("Unable to fetch repository public key: " + JSON.stringify(pk));
              }

              const binkey = sodium.from_base64(pk.key, sodium.base64_variants.ORIGINAL);

              async function setSecret(name, val) {
                if (!val) throw new Error("Value for " + name + " is undefined");
                const encBytes = sodium.crypto_box_seal(sodium.from_string(val), binkey);
                const encVal = sodium.to_base64(encBytes, sodium.base64_variants.ORIGINAL);
                const body = JSON.stringify({ encrypted_value: encVal, key_id: pk.key_id });

                return new Promise((resolve, reject) => {
                  const req = https.request({
                    hostname: "api.github.com",
                    path: "/repos/vinaytiwari-rk/RPF-App/actions/secrets/" + name,
                    method: "PUT",
                    headers: {
                      "User-Agent": "NodeJS",
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                      "Content-Length": Buffer.byteLength(body)
                    }
                  }, (res) => {
                    let d = "";
                    res.on("data", c => d += c);
                    res.on("end", () => {
                      if (res.statusCode === 201 || res.statusCode === 204) {
                        console.log("Secret configured successfully: " + name);
                        resolve();
                      } else {
                        reject(new Error("Failed to set " + name + ": " + res.statusCode + " " + d));
                      }
                    });
                  });
                  req.on("error", reject);
                  req.write(body);
                  req.end();
                });
              }

              await setSecret("RPF_RELEASE_KEYSTORE_B64", process.env.KEYSTORE_B64);
              await setSecret("RPF_RELEASE_STORE_PASSWORD", process.env.STORE_PASS);
              await setSecret("RPF_RELEASE_KEY_ALIAS", process.env.KEY_ALIAS);
              await setSecret("RPF_RELEASE_KEY_PASSWORD", process.env.KEY_PASS);
              console.log("All 4 permanent release secrets provisioned successfully!");
            }

            run().catch(err => {
              console.error(err.message);
              process.exit(1);
            });
          '
