name: Build Android APK

# Fresh CI verification after resolving Home carousel typing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/android-apk.yml'

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Dependencies (retry transient npm network failures)
        shell: bash
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_fetch_retries: '5'
          npm_config_fetch_retry_mintimeout: '20000'
          npm_config_fetch_retry_maxtimeout: '120000'
          npm_config_fetch_timeout: '180000'
          npm_config_maxsockets: '8'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "npm install attempt ${attempt}/3"
            if npm install --include=dev --prefer-offline --no-audit --no-fund; then
              echo "Dependencies installed successfully"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm install failed after three attempts; inspect npm network logs"
              exit 1
            fi
            sleep $((attempt * 20))
          done
      - name: Verify required modules
        run: |
          node -e "console.log('react-router-dom@' + require('./node_modules/react-router-dom/package.json').version)"
          node -e "console.log('@capacitor/android@' + require('./node_modules/@capacitor/android/package.json').version)"
      - name: Type Check
        run: npm run lint
      - name: Build Web Application
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: "CI: Write CAPACITOR_ANDROID_VERSION safely"
        run: |
          VERSION=$(node -p "require('./node_modules/@capacitor/android/package.json').version")
          if grep -q '^CAPACITOR_ANDROID_VERSION=' android/gradle.properties 2>/dev/null; then sed -i "s/^CAPACITOR_ANDROID_VERSION=.*/CAPACITOR_ANDROID_VERSION=${VERSION}/" android/gradle.properties; else printf '\nCAPACITOR_ANDROID_VERSION=%s\n' "${VERSION}" >> android/gradle.properties; fi
          grep '^CAPACITOR_ANDROID_VERSION=' android/gradle.properties
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify Android Build Environment
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version
      - name: Prepare Android signing
        id: signing
        shell: bash
        env:
          RPF_RELEASE_KEYSTORE_B64: ${{ secrets.RPF_RELEASE_KEYSTORE_B64 }}
          RPF_RELEASE_STORE_PASSWORD: ${{ secrets.RPF_RELEASE_STORE_PASSWORD }}
          RPF_RELEASE_KEY_ALIAS: ${{ secrets.RPF_RELEASE_KEY_ALIAS }}
          RPF_RELEASE_KEY_PASSWORD: ${{ secrets.RPF_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$RPF_RELEASE_KEYSTORE_B64" ] && [ -n "$RPF_RELEASE_STORE_PASSWORD" ] && [ -n "$RPF_RELEASE_KEY_ALIAS" ] && [ -n "$RPF_RELEASE_KEY_PASSWORD" ]; then
            mkdir -p android/app/keystore
            printf '%s' "$RPF_RELEASE_KEYSTORE_B64" | base64 --decode > android/app/keystore/rpf-release.jks
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
            echo "Stable release signing credentials are available."
          else
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable release signing secrets are not configured. Building debug APK only; it will NOT update an APK signed with another key."
          fi

      - name: Calculate monotonically increasing Android versionCode
        run: echo "RPF_VERSION_CODE=$((20500 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build Android APK
        working-directory: android
        env:
          RPF_RELEASE_STORE_FILE: ${{ github.workspace }}/android/app/keystore/rpf-release.jks
          RPF_RELEASE_STORE_PASSWORD: ${{ secrets.RPF_RELEASE_STORE_PASSWORD }}
          RPF_RELEASE_KEY_ALIAS: ${{ secrets.RPF_RELEASE_KEY_ALIAS }}
          RPF_RELEASE_KEY_PASSWORD: ${{ secrets.RPF_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.release_ready }}" = "true" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace --warning-mode all
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/RPF-Samahit-update.apk"
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace --warning-mode all
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/RPF-Samahit-debug.apk"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPF-Samahit-Android-${{ github.sha }}
          path: |
            RPF-Samahit-update.apk
            RPF-Samahit-debug.apk
          if-no-files-found: warn
          retention-days: 14
