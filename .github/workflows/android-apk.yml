name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/android-apk.yml'

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Capacitor version
        run: |
          node -e "const p=require('./node_modules/@capacitor/android/package.json'); if(p.version !== '8.5.0') throw new Error('Unexpected @capacitor/android version: '+p.version); console.log('@capacitor/android@'+p.version)"
      - name: Type Check
        run: npm run lint
      - name: Build Web Application
        run: npm run build:web
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Verify updater dependency removal
        run: |
          if grep -Rni --exclude-dir=.git --exclude='package-lock.json' --exclude='*.lock' 'capacitor-updater' package.json capacitor.config.* src android; then
            echo 'Obsolete updater dependency reference remains after cleanup.' >&2
            exit 1
          fi
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify Android Build Environment
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version
      - name: Build Debug APK
        working-directory: android
        env:
          RPF_VERSION_CODE: ${{ github.run_number }}
          RPF_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --warning-mode all
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RPF-Samahit-1.0.${{ github.run_number }}-${{ github.sha }}.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPF-Samahit-1.0.${{ github.run_number }}-${{ github.sha }}
          path: RPF-Samahit-1.0.${{ github.run_number }}-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 14
