name: Build Android APK

# Fresh CI verification after resolving Home carousel typing.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/android-apk.yml'

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Dependencies (retry transient npm network failures)
        shell: bash
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_fetch_retries: '5'
          npm_config_fetch_retry_mintimeout: '20000'
          npm_config_fetch_retry_maxtimeout: '120000'
          npm_config_fetch_timeout: '180000'
          npm_config_maxsockets: '8'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "npm install attempt ${attempt}/3"
            if npm install --include=dev --prefer-offline --no-audit --no-fund; then
              echo "Dependencies installed successfully"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm install failed after three attempts; inspect npm network logs"
              exit 1
            fi
            sleep $((attempt * 20))
          done
      - name: Audit SAMAHIT utility catalog and offline exports
        run: npm run audit:samahit
      - name: Test Live TV direct-stream MIME type selection
        run: npm run audit:live-tv
      - name: Verify required modules
        run: |
          node -e "console.log('react-router-dom@' + require('./node_modules/react-router-dom/package.json').version)"
          node -e "console.log('@capacitor/android@' + require('./node_modules/@capacitor/android/package.json').version)"
      - name: Type Check
        run: npm run lint
      - name: Build Web Application
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: "CI: Write CAPACITOR_ANDROID_VERSION safely"
        run: |
          VERSION=$(node -p "require('./node_modules/@capacitor/android/package.json').version")
          if grep -q '^CAPACITOR_ANDROID_VERSION=' android/gradle.properties 2>/dev/null; then sed -i "s/^CAPACITOR_ANDROID_VERSION=.*/CAPACITOR_ANDROID_VERSION=${VERSION}/" android/gradle.properties; else printf '\nCAPACITOR_ANDROID_VERSION=%s\n' "${VERSION}" >> android/gradle.properties; fi
          grep '^CAPACITOR_ANDROID_VERSION=' android/gradle.properties
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify Android Build Environment
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version
      - name: Prepare Android signing
        id: signing
        shell: bash
        env:
          RPF_RELEASE_KEYSTORE_B64: ${{ secrets.RPF_RELEASE_KEYSTORE_B64 }}
          RPF_RELEASE_STORE_PASSWORD: ${{ secrets.RPF_RELEASE_STORE_PASSWORD }}
          RPF_RELEASE_KEY_ALIAS: ${{ secrets.RPF_RELEASE_KEY_ALIAS }}
          RPF_RELEASE_KEY_PASSWORD: ${{ secrets.RPF_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$RPF_RELEASE_KEYSTORE_B64" ] && [ -n "$RPF_RELEASE_STORE_PASSWORD" ] && [ -n "$RPF_RELEASE_KEY_PASSWORD" ]; then
            mkdir -p android/app/keystore
            printf '%s' "$RPF_RELEASE_KEYSTORE_B64" | base64 --decode > android/app/keystore/rpf-release.jks
            
            # Detect actual alias present inside the keystore (handles .p12, .jks, custom aliases, etc.)
            DETECTED_ALIAS=$(keytool -list -keystore android/app/keystore/rpf-release.jks -storepass "$RPF_RELEASE_STORE_PASSWORD" 2>/dev/null | grep -E "PrivateKeyEntry|trustedCertEntry" | head -n 1 | cut -d',' -f1 | xargs || true)
            
            if [ -n "$DETECTED_ALIAS" ]; then
              echo "ACTUAL_KEY_ALIAS=$DETECTED_ALIAS" >> "$GITHUB_ENV"
              echo "Found alias in keystore: $DETECTED_ALIAS"
            else
              CLEAN_ALIAS=$(echo "${RPF_RELEASE_KEY_ALIAS:-rpf-release-key}" | xargs)
              echo "ACTUAL_KEY_ALIAS=$CLEAN_ALIAS" >> "$GITHUB_ENV"
            fi

            echo "release_ready=true" >> "$GITHUB_OUTPUT"
            echo "Stable release signing credentials are available."
          else
            if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
              echo "::error::Production APK release blocked: configure RPF_RELEASE_KEYSTORE_B64, RPF_RELEASE_STORE_PASSWORD, and RPF_RELEASE_KEY_PASSWORD in GitHub Actions secrets. A debug APK cannot update the installed signed app."
              exit 1
            fi
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets are unavailable for this non-production build; building a debug APK only."
          fi

      - name: Calculate monotonically increasing Android versionCode
        run: echo "RPF_VERSION_CODE=$((20500 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build Android APK
        working-directory: android
        env:
          RPF_RELEASE_STORE_FILE: ${{ github.workspace }}/android/app/keystore/rpf-release.jks
          RPF_RELEASE_STORE_PASSWORD: ${{ secrets.RPF_RELEASE_STORE_PASSWORD }}
          RPF_RELEASE_KEY_ALIAS: ${{ env.ACTUAL_KEY_ALIAS }}
          RPF_RELEASE_KEY_PASSWORD: ${{ secrets.RPF_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.release_ready }}" = "true" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace --warning-mode all
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/RPF-Samahit-update.apk"
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace --warning-mode all
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/RPF-Samahit-debug.apk"
          fi

      - name: Generate Update Manifest and Stage Deployment (Release Only)
        if: steps.signing.outputs.release_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p updates download
          cp "$GITHUB_WORKSPACE/RPF-Samahit-update.apk" download/rpf-app.apk
          SHA256=$(sha256sum download/rpf-app.apk | awk '{print $1}')
          SIZE=$(wc -c < download/rpf-app.apk | tr -d ' ')
          VERSION_NAME=$(node -p "require('./package.json').version")
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          export VERSION_NAME SHA256 SIZE PUB_DATE
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          // Use only changes since the previous version-bump commit.
          const previousBump = execFileSync(
            'git',
            ['log', '-1', '--format=%H', '--grep=^chore(release): bump version to ', 'HEAD^'],
            { encoding: 'utf8' }
          ).trim();

          const range = previousBump ? `${previousBump}..HEAD^` : 'HEAD~20..HEAD^';
          const subjects = execFileSync(
            'git',
            ['log', range, '--pretty=format:%s'],
            { encoding: 'utf8' }
          ).split('\n').map(line => line.trim()).filter(Boolean);

          function formatSubject(str) {
            if (!str) return null;
            if (/^chore\(release\)|^Merge branch|^Merge pull request|\[skip ci\]/i.test(str)) return null;

            const scopedMatch = str.match(/^(?:feat|fix|perf|refactor|style|build|docs)\(([^)]+)\):\s*(.+)$/i);
            if (scopedMatch) {
              const rawScope = scopedMatch[1].trim().toLowerCase();
              if (/^ci\b|^deps\b|^test\b/i.test(rawScope)) return null;
              let desc = scopedMatch[2].trim();
              desc = desc.charAt(0).toUpperCase() + desc.slice(1);
              const scopeMap = {
                nav: 'Navigation',
                ui: 'UI & Design',
                home: 'Home Screen',
                explore: 'Explore',
                activity: 'Activity',
                impact: 'Social Impact',
                auth: 'Account & Login',
                'live-tv': 'Live TV',
                livetv: 'Live TV',
                reels: 'Shorts & Reels',
                reel: 'Shorts & Reels',
                admin: 'Admin Studio',
                updater: 'Update Center',
                update: 'Update Center',
                sync: 'Data Sync',
                icon: 'Icons & Artwork',
                icons: 'Icons & Artwork'
              };
              const scope = scopeMap[rawScope] || (rawScope.charAt(0).toUpperCase() + rawScope.slice(1));
              return `${scope}: ${desc}`;
            }

            const simpleMatch = str.match(/^(?:feat|fix|perf|refactor|style|build|docs):\s*(.+)$/i);
            if (simpleMatch) {
              let desc = simpleMatch[1].trim();
              return desc.charAt(0).toUpperCase() + desc.slice(1);
            }

            return str.charAt(0).toUpperCase() + str.slice(1);
          }

          const friendly = [];
          for (const subject of subjects) {
            const note = formatSubject(subject);
            if (note && !friendly.includes(note)) friendly.push(note);
            if (friendly.length >= 8) break;
          }

          if (!friendly.length) {
            try {
              const fallbackSubjects = execFileSync(
                'git',
                ['log', '-15', '--pretty=format:%s', 'HEAD'],
                { encoding: 'utf8' }
              ).split('\n').map(line => line.trim()).filter(Boolean);
              for (const subject of fallbackSubjects) {
                const note = formatSubject(subject);
                if (note && !friendly.includes(note)) friendly.push(note);
                if (friendly.length >= 5) break;
              }
            } catch (e) {}
          }

          const manifest = {
            versionCode: Number(process.env.RPF_VERSION_CODE),
            versionName: process.env.VERSION_NAME,
            sha256: process.env.SHA256,
            size: Number(process.env.SIZE),
            downloadUrl: 'https://appapi.therpfoundation.org/download/rpf-app.apk',
            minSupportedVersionCode: 20500,
            releaseNotes: friendly.length
              ? 'What’s new in this update:\n• ' + friendly.join('\n• ')
              : 'General performance enhancements and feature updates.',
            publishedAt: process.env.PUB_DATE
          };
          fs.writeFileSync('updates/manifest.json', JSON.stringify(manifest, null, 2) + '\n', 'utf8');
          NODE
          # Keep the runtime manifest, bundled web fallback, and published artifact in sync.
          mkdir -p public/updates dist/updates
          cp updates/manifest.json public/updates/manifest.json
          cp updates/manifest.json dist/updates/manifest.json
          node - <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const manifest = JSON.parse(fs.readFileSync('updates/manifest.json', 'utf8'));
          if (manifest.versionName !== pkg.version) throw new Error('Update manifest version does not match package.json.');
          if (!Number.isInteger(manifest.versionCode) || manifest.versionCode < 1) throw new Error('Update manifest versionCode is invalid.');
          if (!/^[a-f0-9]{64}$/i.test(String(manifest.sha256 || ''))) throw new Error('Update manifest SHA-256 is missing or invalid.');
          if (!Number.isInteger(manifest.size) || manifest.size < 1) throw new Error('Update manifest APK size is invalid.');
          if (!fs.existsSync('download/rpf-app.apk')) throw new Error('Release APK download file is missing.');
          console.log('Validated release manifest for version', manifest.versionName, 'code', manifest.versionCode);
          NODE
          echo "Generated and validated updates/manifest.json:"
          cat updates/manifest.json

      - name: Publish APK and Manifest to Server via FTP
        if: steps.signing.outputs.release_ready == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SECURE: ${{ secrets.FTP_SECURE }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FTP_INCREMENTAL: "true"
          DEPLOY_RELEASE_ARTIFACTS: "true"
        run: |
          set -euo pipefail
          if [ -n "$FTP_HOST" ] && [ -n "$FTP_USER" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "Deploying release APK and manifest to server via FTP..."
            node deploy.cjs
            echo "FTP update deployment complete."
          else
            echo "::error::Production APK was built but not published: configure FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD GitHub Actions secrets; set FTP_REMOTE_DIR if the app is not at the FTP account root."
            exit 1
          fi

      - name: Verify live Android update manifest
        if: steps.signing.outputs.release_ready == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          LIVE_MANIFEST_URL="https://appapi.therpfoundation.org/api/public/app-update?_t=$(date +%s)"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 \
            -H "Cache-Control: no-cache" "$LIVE_MANIFEST_URL" -o /tmp/rpf-live-update-manifest.json
          node - <<'NODE'
          const fs = require('fs');
          const expected = JSON.parse(fs.readFileSync('updates/manifest.json', 'utf8'));
          const live = JSON.parse(fs.readFileSync('/tmp/rpf-live-update-manifest.json', 'utf8'));
          if (live.success === false) throw new Error('Live update endpoint reported failure.');
          if (live.versionName !== expected.versionName) {
            throw new Error('Live update version mismatch: expected ' + expected.versionName + ', received ' + live.versionName);
          }
          if (live.versionCode !== expected.versionCode) {
            throw new Error('Live update versionCode mismatch: expected ' + expected.versionCode + ', received ' + live.versionCode);
          }
          if (String(live.sha256 || '').toLowerCase() !== String(expected.sha256 || '').toLowerCase()) {
            throw new Error('Live update SHA-256 does not match the uploaded release APK.');
          }
          console.log('Live update manifest verified:', live.versionName, live.versionCode);
          NODE

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RPF-Samahit-Android-${{ github.sha }}
          path: |
            RPF-Samahit-update.apk
            RPF-Samahit-debug.apk
            updates/manifest.json
            download/rpf-app.apk
          if-no-files-found: warn
          retention-days: 14
