name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/android-apk.yml'

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Use the same dependency-install strategy as the passing web deployment.
      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Type Check
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: CI: Print Capacitor Android info
        run: |
          node -v
          echo "=== node_modules/@capacitor/android ==="
          if [ -f node_modules/@capacitor/android/package.json ]; then
            node -p "require('./node_modules/@capacitor/android/package.json').version"
            if command -v jq >/dev/null 2>&1; then
              jq -r '.name + "@" + .version' node_modules/@capacitor/android/package.json || cat node_modules/@capacitor/android/package.json
            else
              cat node_modules/@capacitor/android/package.json
            fi
          else
            echo "node_modules/@capacitor/android not found"
          fi

      - name: CI: Write CAPACITOR_ANDROID_VERSION to android/gradle.properties
        run: |
          if [ -f node_modules/@capacitor/android/package.json ]; then
            VERSION=$(node -p "require('./node_modules/@capacitor/android/package.json').version")
            echo "CAPACITOR_ANDROID_VERSION=${VERSION}" > android/gradle.properties
            echo "Wrote CAPACITOR_ANDROID_VERSION=${VERSION} to android/gradle.properties"
          else
            echo "# no capacitor android found" > android/gradle.properties
            echo "No local capacitor android; gradle.properties created without version"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Android Build Environment
        working-directory: android
        run: |
          gradle --version
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon --info

      - name: Build Debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RPF-Seva-App-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPF-Seva-App-Android-${{ github.sha }}
          path: RPF-Seva-App-debug.apk
          if-no-files-found: error
          retention-days: 14
