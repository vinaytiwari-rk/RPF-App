name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Native/package changes only. Normal web/UI/content deployments do not
      # create a new APK, keeping the installed base APK stable.
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - '.github/workflows/android-apk.yml'

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Materialize Official RPF App Icon
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 -d android/app/src/main/assets/rpf-logo.webp.base64 > android/app/src/main/res/drawable-nodpi/rpf_launcher_icon.webp

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Android Build Environment
        working-directory: android
        run: |
          gradle --version
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RPF-Seva-App-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPF-Seva-App-Android-${{ github.sha }}
          path: RPF-Seva-App-debug.apk
          if-no-files-found: error
          retention-days: 14
