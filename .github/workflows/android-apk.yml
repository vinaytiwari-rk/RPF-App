name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/android-apk.yml'

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Use deterministic dependency-install strategy
      - name: Install Dependencies (deterministic)
        run: npm ci --no-audit --no-fund

      - name: Verify install & required modules
        run: |
          echo "== verify: package-lock and required modules =="
          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json missing" >&2
            exit 1
          fi
          if [ ! -f node_modules/react-router-dom/package.json ]; then
            echo "ERROR: react-router-dom not found in node_modules; npm ci may have failed" >&2
            ls -la node_modules | sed -n '1,200p' || true
            exit 2
          fi
          if [ ! -f node_modules/@capacitor/android/package.json ]; then
            echo "ERROR: node_modules/@capacitor/android not found; npx cap sync android requires it. Failing rather than creating placeholders." >&2
            exit 3
          fi
          node -e "console.log('react-router-dom@' + require('./node_modules/react-router-dom/package.json').version)"
          node -e "console.log('@capacitor/android@' + require('./node_modules/@capacitor/android/package.json').version)"

      - name: Type Check
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: CI: Print Capacitor Android info
        run: |
          node -v
          echo "=== node_modules/@capacitor/android ==="
          if [ -f node_modules/@capacitor/android/package.json ]; then
            node -p "require('./node_modules/@capacitor/android/package.json').version"
            if command -v jq >/dev/null 2>&1; then
              jq -r '.name + "@" + .version' node_modules/@capacitor/android/package.json || cat node_modules/@capacitor/android/package.json
            else
              cat node_modules/@capacitor/android/package.json
            fi
          else
            echo "node_modules/@capacitor/android not found"
          fi

      - name: CI: Write CAPACITOR_ANDROID_VERSION to android/gradle.properties
        run: |
          if [ -f node_modules/@capacitor/android/package.json ]; then
            VERSION=$(node -p "require('./node_modules/@capacitor/android/package.json').version")
            echo "Found local @capacitor/android version: ${VERSION}"
            if [ -f android/gradle.properties ]; then
              if grep -q '^CAPACITOR_ANDROID_VERSION=' android/gradle.properties; then
                sed -i "s/^CAPACITOR_ANDROID_VERSION=.*/CAPACITOR_ANDROID_VERSION=${VERSION}/" android/gradle.properties
                echo "Replaced CAPACITOR_ANDROID_VERSION in android/gradle.properties"
              else
                printf "\nCAPACITOR_ANDROID_VERSION=%s\n" "${VERSION}" >> android/gradle.properties
                echo "Appended CAPACITOR_ANDROID_VERSION to android/gradle.properties"
              fi
            else
              printf "CAPACITOR_ANDROID_VERSION=%s\n" "${VERSION}" > android/gradle.properties
              echo "Created android/gradle.properties (only CAPACITOR_ANDROID_VERSION) because file did not exist"
            fi
          else
            echo "ERROR: node_modules/@capacitor/android not found; cannot set CAPACITOR_ANDROID_VERSION. Run npm ci or ensure @capacitor/android is available." >&2
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Android Build Environment
        working-directory: android
        run: |
          gradle --version
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon --info

      - name: Build Debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RPF-Seva-App-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPF-Seva-App-Android-${{ github.sha }}
          path: RPF-Seva-App-debug.apk
          if-no-files-found: error
          retention-days: 14
