name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/android-apk.yml'

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Use the same dependency-install strategy as the passing web deployment.
      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Type Check
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Capacitor Android module
        run: |
          if [ -d "node_modules/@capacitor/android/capacitor" ]; then
            echo "Capacitor Android module present"
          else
            echo "ERROR: Capacitor Android module not found under node_modules/@capacitor/android/capacitor"
            echo "Contents of node_modules (top-level):"
            ls -la node_modules || true
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Android Build Environment
        working-directory: android
        run: |
          gradle --version
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RPF-Seva-App-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPF-Seva-App-Android-${{ github.sha }}
          path: RPF-Seva-App-debug.apk
          if-no-files-found: error
          retention-days: 14
