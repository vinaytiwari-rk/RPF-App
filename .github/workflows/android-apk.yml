name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/android-apk.yml'

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Verify required modules
        run: |
          node -e "console.log('react-router-dom@' + require('./node_modules/react-router-dom/package.json').version)"
          node -e "console.log('@capacitor/android@' + require('./node_modules/@capacitor/android/package.json').version)"

      - name: Type Check
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: "CI: Write CAPACITOR_ANDROID_VERSION safely"
        run: |
          if [ ! -f node_modules/@capacitor/android/package.json ]; then
            echo "ERROR: @capacitor/android is missing" >&2
            exit 1
          fi
          VERSION=$(node -p "require('./node_modules/@capacitor/android/package.json').version")
          if grep -q '^CAPACITOR_ANDROID_VERSION=' android/gradle.properties 2>/dev/null; then
            sed -i "s/^CAPACITOR_ANDROID_VERSION=.*/CAPACITOR_ANDROID_VERSION=${VERSION}/" android/gradle.properties
          else
            printf '\nCAPACITOR_ANDROID_VERSION=%s\n' "${VERSION}" >> android/gradle.properties
          fi
          grep '^CAPACITOR_ANDROID_VERSION=' android/gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android Build Environment
        working-directory: android
        run: |
          chmod +x gradlew
          echo "=== SYSTEM DIAGNOSTICS ===" > version_log.txt
          echo "Java Path: $(which java)" >> version_log.txt
          echo "JAVA_HOME: $JAVA_HOME" >> version_log.txt
          java -version >> version_log.txt 2>&1 || true
          echo "=== GRADLEW EXECUTION ===" >> version_log.txt
          ./gradlew --version >> version_log.txt 2>&1 || true
          cat version_log.txt >> $GITHUB_STEP_SUMMARY
          ./gradlew --version

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Upload Diagnostics Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-log
          path: android/version_log.txt

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RPF-Seva-App-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPF-Seva-App-Android-${{ github.sha }}
          path: RPF-Seva-App-debug.apk
          if-no-files-found: error
          retention-days: 14
