name: Gemini Issue Triage
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Gemini CLI runs in a clean GitHub Actions checkout. Explicitly trust
      # that workspace so headless issue triage does not fail the trust guard.
      GEMINI_CLI_TRUST_WORKSPACE: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Gemini CLI
        # v0.1.22 is a published release; @v1 does not exist.
        uses: google-github-actions/run-gemini-cli@v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: "Review this newly opened issue. Summarize the likely category, identify missing reproduction details, and suggest labels or immediate troubleshooting steps. Do not modify repository files."
