name: Publish GitHub Release

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'chore(release): bump version to ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout versioned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Android build artifacts
        id: artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: release-assets
          merge-multiple: true

      - name: Publish release with signed APK when available
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi

          APK_PATH=""
          if [ -d release-assets ]; then
            APK_PATH="$(find release-assets -type f -name 'RPF-Samahit-update.apk' -print -quit || true)"
          fi

          if [ -n "$APK_PATH" ]; then
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --target "$RELEASE_SHA" \
              --title "RPF-App $RELEASE_TAG" \
              --generate-notes
            echo "Published $RELEASE_TAG with signed update APK."
          else
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_SHA" \
              --title "RPF-App $RELEASE_TAG" \
              --generate-notes
            echo "::warning::Published $RELEASE_TAG without an APK because no signed RPF-Samahit-update.apk was available. Debug APKs are intentionally not attached as production updates."
          fi
